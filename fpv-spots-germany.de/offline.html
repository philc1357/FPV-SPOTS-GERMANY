<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV Spots Germany – Offline</title>
    <meta name="theme-color" content="#0A0E15">
    <style>
        /* Webfonts wie theme.css – liegen im Service-Worker-Precache */
        @font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; font-display: swap;
            src: url("/public/vendor/fonts/bricolage-grotesque-latin-wght.woff2") format("woff2"); }
        @font-face { font-family: "Figtree"; font-weight: 300 900; font-display: swap;
            src: url("/public/vendor/fonts/figtree-latin-wght.woff2") format("woff2"); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* Farben = Design-Tokens aus theme.css (hier fest, da statische Seite) */
            background: radial-gradient(ellipse at top, rgba(202, 113, 15, .10), transparent 60%), #0A0E15;
            color: #E7EDF6;
            font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        img { max-width: 120px; margin-bottom: 1.5rem; }
        h1 { font-family: "Bricolage Grotesque", "Figtree", system-ui, sans-serif; font-size: 1.75rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 0.5rem; color: #fff; }
        p { color: #94A3BA; margin-bottom: 2rem; max-width: 320px; }
        .retry {
            display: inline-block;
            text-decoration: none;
            background: #CA710F;
            color: #160B01;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .retry:hover { background: #E8963A; }
        .retry:focus-visible { outline: 2px solid #E8963A; outline-offset: 3px; }
        .retry:active { background: #A85D0B; }
    </style>
</head>
<body>
    <main>
        <img src="/public/imgs/logo.png" alt="FPV Spots Germany Logo" width="120" height="120">
        <h1>Du bist offline</h1>
        <p>Bitte überprüfe deine Internetverbindung und versuche es erneut.</p>
        <!-- Link auf die aktuelle Adresse = Neu laden (CSP: kein onclick) -->
        <a class="retry" href="">Erneut versuchen</a>
    </main>
</body>
</html>
