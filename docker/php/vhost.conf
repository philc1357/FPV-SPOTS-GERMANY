# =============================================================
# vHosts – DocumentRoot ist das Webroot-Unterverzeichnis,
# gemountet wird aber der Projekt-Root (vendor/ und .env liegen
# eine Ebene darüber und dürfen NICHT web-erreichbar sein)
# =============================================================

# -------------------------------------------------------------
# Gemeinsame Verzeichnisregeln
#   AllowOverride All ist zwingend, sonst greift die .htaccess
#   mit Routing, Security-Headern und HTTPS-Redirect nicht
# -------------------------------------------------------------
<Directory /var/www/html/fpv-spots-germany.de>
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# Projekt-Root selbst bleibt gesperrt (Defense in Depth –
# er liegt ohnehin außerhalb des DocumentRoot)
<Directory /var/www/html>
    Require all denied
</Directory>

# -------------------------------------------------------------
# HTTP – leitet nicht selbst um; das erledigt die .htaccess
# des Projekts (301 auf https), damit Prod-Verhalten 1:1 gilt
# -------------------------------------------------------------
<VirtualHost *:80>
    ServerName   fpv.localhost
    ServerAlias  localhost 127.0.0.1
    DocumentRoot /var/www/html/fpv-spots-germany.de

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

# -------------------------------------------------------------
# HTTPS – selbstsigniertes Zertifikat, beim ersten Start vom
# Entrypoint erzeugt (siehe entrypoint.sh)
# -------------------------------------------------------------
<VirtualHost *:443>
    ServerName   fpv.localhost
    ServerAlias  localhost 127.0.0.1
    DocumentRoot /var/www/html/fpv-spots-germany.de

    SSLEngine on
    SSLCertificateFile    /etc/ssl/app/server.crt
    SSLCertificateKeyFile /etc/ssl/app/server.key

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
