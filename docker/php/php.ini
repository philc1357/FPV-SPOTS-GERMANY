; =============================================================
; PHP-Overrides – NUR für die lokale Entwicklungsumgebung
; =============================================================

; --- Uploads -------------------------------------------------
; Die Upload-Handler erlauben 5 MB pro Bild bei mehreren Bildern
; pro Forum-Post; die PHP-Defaults (2M/8M) würden vorher abschneiden
upload_max_filesize = 8M
post_max_size       = 64M
max_file_uploads    = 20

; --- Ressourcen ----------------------------------------------
; GD-Bildverarbeitung braucht Luft
memory_limit        = 256M
max_execution_time  = 60

; --- Fehlerausgabe -------------------------------------------
; Lokal sichtbar machen statt nur "Datenbankfehler" zu sehen.
; In Produktion gilt weiterhin: generische Meldung an den User.
display_errors        = On
display_startup_errors = On
error_reporting       = E_ALL
log_errors            = On
error_log             = /dev/stderr

; --- Sonstiges -----------------------------------------------
date.timezone = Europe/Berlin
expose_php    = Off
